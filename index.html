<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity DashBoard</title>
    <link rel="stylesheet" href="style.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
    <main>
        <section class="Allelem">
            <section class="cards todo" id="1">
                <img src="https://images.unsplash.com/photo-1779653777982-7cb88b03dfe9?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDZ8Q0R3dXdYSkFiRXd8fGVufDB8fHx8fA%3D%3D" alt="Couldn't Load">
                <section class="bottom">
                    <p>To-Do List</p>
                </section>

            </section>
            <section class="cards daily" id="2">
                <img src="https://images.unsplash.com/photo-1778351984093-ff1e2771aae9?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDN8Q0R3dXdYSkFiRXd8fGVufDB8fHx8fA%3D%3D" alt="Couldn't Load">
                <section class="bottom">
                    <p>Daily Planner</p>
                </section>

            </section>
            <section class="cards mot" id="3">
                <img src="https://images.unsplash.com/photo-1699009436048-df0b5008bef3?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDE4fENEd3V3WEpBYkV3fHxlbnwwfHx8fHw%3D" alt="Couldn't Load">
                <section class="bottom">
                    <p>Motivation</p>
                </section>

            </section>
            <section class="cards pomo" id="4">
                <img src="https://images.unsplash.com/photo-1784268097662-946309ede0ea?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDkzfENEd3V3WEpBYkV3fHxlbnwwfHx8fHw%3D" alt="Couldn't Load">
                <section class="bottom">
                    <p>Pomodoro Timer</p>
                </section>

            </section>
            <section class="cards goals" id="5">
                <img src="https://images.unsplash.com/photo-1788078486211-70fabb75a585?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDE4OXxDRHd1d1hKQWJFd3x8ZW58MHx8fHx8" alt="Couldn't Load">
                <section class="bottom">
                    <p>Daily Goals</p>
                </section>

            </section>
        </section>
        <section class="elem todo-full" id="1">
            <p>To-Do List</p>
            <button class="back"><i class="ri-close-large-fill"></i></button>
            <section class="task-container">
                <section class="task-container">
                    <section class="add-task">
                        <form>
                          <input type="text" placeholder="Enter Task" required>
                          <textarea placeholder="Enter the Task details" rows="5" cols="50" required></textarea>
                          <button type="submit">Add Task</button>
                        </form>
                    </section>
                    <section class="remove-task"></section>
                </section>
            </section>
            </section>
        </section>
        <section class="elem plan-full" id="2">
            <p>Daily Planner</p>
            <button class="back"><i class="ri-close-large-fill"></i></button>
        </section>
        <section class="elem moti-full" id="3">
            <p>Motivation</p>
            <button class="back"><i class="ri-close-large-fill"></i></button>
        </section>
        <section class="elem pomo-full" id="4">
            <p>Pomodoro Timer</p>
            <button class="back"><i class="ri-close-large-fill"></i></button>
        </section>
        <section class="elem goal-full" id="5">
            <p>Daily Goals</p>
            <button class="back"><i class="ri-close-large-fill"></i></button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
